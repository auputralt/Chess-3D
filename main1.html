<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Chess — Built by Mr. Putra. Full-featured chess with 2-player and AI modes.">
<meta name="author" content="Mr. Putra">
<title>Chess — Built by Mr. Putra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e0c09;--surface:#1a1714;--surface2:#252119;--surface3:#302a1e;
  --accent:#c9a94e;--accent-dim:#7a6830;--accent-bg:rgba(201,169,78,.08);
  --text:#e8e0d0;--muted:#6a6258;--muted2:#4a4238;
  --light:#e8cfa0;--dark:#8b6b3d;
  --sq-sel:rgba(201,169,78,.45);--sq-last:rgba(201,169,78,.22);
  --sq-chk:rgba(220,55,55,.55);--dot:rgba(0,0,0,.25);
  --board:min(72vmin,500px);--sq:calc(var(--board)/8);
  --radius:8px;--radius-sm:5px
}
html,body{height:100%}
body{
  font-family:'DM Mono','Courier New',monospace;
  background:var(--bg);color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding:12px;
  background-image:
    radial-gradient(ellipse at 40% 30%,rgba(60,40,15,.1) 0%,transparent 60%),
    radial-gradient(ellipse at 70% 80%,rgba(139,107,61,.06) 0%,transparent 50%)
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
  opacity:.02
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  width:100%;max-width:920px;padding:8px 0
}
.menu-hero{text-align:center;padding:40px 0 8px}
.menu-icon{
  font-size:3.5rem;line-height:1;text-shadow:0 4px 12px rgba(201,169,78,.2);
  display:block;margin-bottom:8px
}
.title{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;
  font-size:clamp(2.2rem,6vw,3.2rem);letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);line-height:1
}
.credit{font-size:.65rem;color:var(--muted);letter-spacing:.1em;margin-top:6px;text-transform:uppercase}
.subtitle{font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-top:14px}
.menu-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.menu-btn{
  font-family:inherit;background:var(--surface);border:1px solid var(--surface2);
  border-radius:var(--radius);padding:24px 34px;cursor:pointer;text-align:center;
  transition:all .3s ease;min-width:180px
}
.menu-btn:hover{border-color:var(--accent-dim);background:var(--accent-bg);transform:translateY(-3px)}
.menu-btn:active{transform:translateY(-1px)}
.mb-title{
  display:block;font-family:'Cormorant Garamond',serif;font-size:1.3rem;
  font-weight:600;color:var(--accent);letter-spacing:.04em
}
.mb-desc{display:block;font-size:.65rem;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.diff-panel{margin-top:22px;animation:slideDown .3s ease forwards}
.diff-label{
  font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);text-align:center;margin-bottom:10px
}
.diff-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.diff-btn{
  font-family:inherit;background:var(--surface);border:1px solid var(--surface2);
  border-radius:var(--radius-sm);padding:14px 20px;cursor:pointer;
  text-align:center;transition:all .25s ease;min-width:130px
}
.diff-btn:hover{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-bg)}
.db-name{display:block;font-size:.78rem;font-weight:500;letter-spacing:.08em}
.db-desc{display:block;font-size:.58rem;color:var(--muted);margin-top:3px}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.game-header{
  text-align:center;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:4px
}
.gh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.title-sm{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(1.3rem,3.5vw,1.8rem);letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);line-height:1
}
.badge{
  font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:var(--surface2);border:1px solid var(--surface3);
  padding:3px 10px;border-radius:20px
}
.turn{
  font-size:.72rem;color:var(--muted);letter-spacing:.06em;
  min-height:1.2em;text-align:center;transition:color .3s
}
.turn.alert{color:#dc3535}
.game-area{display:flex;gap:22px;align-items:flex-start;width:100%;justify-content:center}
@media(max-width:740px){.game-area{flex-direction:column;align-items:center}}
.board-col{position:relative;flex-shrink:0}
.scene{
  perspective:1000px;perspective-origin:50% 42%;
  padding:10px 10px 28px;
  background:radial-gradient(ellipse at 50% 50%,rgba(45,32,15,.2) 0%,transparent 70%);
  border-radius:12px
}
.board{
  display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));
  border:7px solid #3a2810;border-radius:2px;
  transform:rotateX(16deg);transform-style:preserve-3d;
  box-shadow:
    0 1px 0 0 #50402a,0 2px 0 0 #403020,0 3px 0 0 #302010,
    0 4px 0 0 #201508,0 5px 0 0 #100a02,
    0 12px 24px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.25);
  touch-action:manipulation;position:relative
}
.board::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:15;
  background:linear-gradient(150deg,rgba(255,255,255,.035) 0%,transparent 40%,rgba(0,0,0,.035) 100%)
}
.sq{
  width:var(--sq);height:var(--sq);display:flex;align-items:center;
  justify-content:center;position:relative;cursor:default;
  user-select:none;-webkit-user-select:none;transition:filter .12s ease
}
.sq.light{background:linear-gradient(135deg,#ecd4a2 0%,#d9bf85 100%)}
.sq.dark{background:linear-gradient(135deg,#9a7548 0%,#7a5a30 100%)}
.sq.clickable{cursor:pointer}
.sq.clickable:hover{filter:brightness(1.1)}
.sq.selected{background:var(--sq-sel)!important}
.sq.last-from,.sq.last-to{background:var(--sq-last)!important}
.sq.check{
  background:var(--sq-chk)!important;
  animation:chkPulse 1s ease-in-out infinite alternate
}
@keyframes chkPulse{
  from{box-shadow:inset 0 0 10px rgba(220,55,55,.25)}
  to{box-shadow:inset 0 0 20px rgba(220,55,55,.5)}
}
.piece{
  font-size:calc(var(--sq)*.78);line-height:1;pointer-events:none;z-index:2;
  text-shadow:1px 1px 0 rgba(0,0,0,.25),2px 2px 0 rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.3)
}
.sq.last-to .piece{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.coord{position:absolute;pointer-events:none;z-index:3;opacity:.55;font-weight:500}
.coord.file{bottom:1px;right:3px;font-size:calc(var(--sq)*.16)}
.coord.rank{top:1px;left:3px;font-size:calc(var(--sq)*.16)}
.sq.light .coord{color:var(--dark)}.sq.dark .coord{color:var(--light)}
.ind{position:absolute;pointer-events:none;z-index:1}
.ind.dot{width:calc(var(--sq)*.3);height:calc(var(--sq)*.3);border-radius:50%;background:var(--dot)}
.ind.cap{
  width:calc(var(--sq)*.88);height:calc(var(--sq)*.88);
  border-radius:50%;border:calc(var(--sq)*.07) solid var(--dot);background:transparent
}
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(14,12,9,.92);border-radius:2px;z-index:20;
  opacity:0;pointer-events:none;transition:opacity .4s ease
}
.overlay.vis{opacity:1;pointer-events:auto}
.overlay-inner{text-align:center;animation:rise .5s ease forwards}
.overlay-txt{
  font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,3vw,1.6rem);
  font-weight:700;color:var(--accent);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:20px
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.sidebar{
  display:flex;flex-direction:column;gap:10px;
  min-width:200px;max-width:240px;width:100%
}
@media(max-width:740px){
  .sidebar{max-width:500px;min-width:0}
  .card-history{order:99}
}
.card{
  background:var(--surface);border:1px solid var(--surface2);
  border-radius:var(--radius);padding:12px 14px
}
.card-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.13em;
  color:var(--muted2);margin-bottom:6px
}
.lm-row{display:flex;align-items:center;gap:10px}
.lm-piece{font-size:1.8rem;line-height:1}
.lm-info{flex:1;min-width:0}
.lm-detail{font-size:.7rem;color:var(--text);line-height:1.5}
.lm-notation{
  display:inline-block;font-size:.72rem;font-weight:500;
  color:var(--accent);background:var(--accent-bg);
  padding:2px 8px;border-radius:3px;margin-top:3px
}
.lm-capture{font-size:.65rem;color:var(--muted);margin-top:2px}
.lm-placeholder{font-size:.68rem;color:var(--muted2);font-style:italic}
.cap-section{display:flex;flex-direction:column;gap:6px}
.cap-side{display:flex;align-items:flex-start;gap:8px;min-height:22px}
.cap-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;
  border:1px solid var(--surface3)
}
.cap-dot.white{background:var(--light)}.cap-dot.black{background:var(--dark)}
.cap-row{display:flex;flex-wrap:wrap;gap:1px;align-items:center}
.cap-pc{font-size:1rem;opacity:.7;line-height:1}
.material{
  font-size:.62rem;color:var(--muted);letter-spacing:.06em;
  margin-top:6px;padding-top:6px;border-top:1px solid var(--surface2);min-height:1em
}
.card-history{flex:1;min-height:0}
.history-scroll{
  max-height:180px;overflow-y:auto;scrollbar-width:thin;
  scrollbar-color:var(--accent-dim) var(--surface2)
}
.history-scroll::-webkit-scrollbar{width:5px}
.history-scroll::-webkit-scrollbar-track{background:var(--surface2);border-radius:3px}
.history-scroll::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:3px}
.history-empty{font-size:.65rem;color:var(--muted2);font-style:italic;padding:4px 0}
.history-row{
  display:grid;grid-template-columns:28px 1fr 1fr;gap:0;
  padding:0;border-bottom:1px solid rgba(37,33,25,.5)
}
.history-row:last-child{border-bottom:none}
.h-num{
  font-size:.62rem;color:var(--muted2);text-align:right;
  padding:5px 6px 5px 0;line-height:1.3
}
.h-move{
  font-size:.68rem;padding:5px 6px;line-height:1.3;
  border-radius:2px;transition:background .15s ease;color:var(--text)
}
.h-move.active{background:var(--accent);color:var(--bg);font-weight:500}
.h-move.latest{animation:flashBg .6s ease}
@keyframes flashBg{0%{background:rgba(201,169,78,.35)}100%{background:transparent}}
.actions{display:flex;gap:8px}
.btn{
  font-family:'DM Mono',monospace;font-size:.68rem;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;background:transparent;
  color:var(--accent);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);
  padding:10px 14px;cursor:pointer;transition:all .25s ease;flex:1
}
.btn:hover{background:var(--accent);color:var(--bg);letter-spacing:.14em}
.btn:active{transform:scale(.97)}
.btn-sec{color:var(--muted);border-color:var(--surface3)}
.btn-sec:hover{color:var(--text);background:var(--surface3);letter-spacing:.14em}
.thinking{
  color:var(--accent);font-size:.72rem;letter-spacing:.08em;
  text-align:center;animation:pulse 1.2s ease-in-out infinite;padding:6px 0
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);border:1px solid var(--accent-dim);
  border-radius:12px;padding:24px 28px;text-align:center;animation:rise .3s ease forwards
}
.modal-title{
  font-family:'Cormorant Garamond',serif;font-size:1.1rem;
  font-weight:600;color:var(--accent);margin-bottom:16px
}
.promo-choices{display:flex;gap:10px}
.promo-btn{
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;background:var(--surface2);border:2px solid transparent;
  border-radius:8px;cursor:pointer;transition:all .2s ease;line-height:1
}
.promo-btn:hover{border-color:var(--accent);background:var(--accent-bg);transform:scale(1.1)}
.promo-btn:active{transform:scale(1.04)}
.footer{
  font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);text-align:center;padding:10px 0 4px;
  border-top:1px solid var(--surface2);width:100%;margin-top:4px
}
</style>
</head>
<body>

<div class="app" id="menuScreen">
  <div class="menu-hero">
    <span class="menu-icon">&#9812;</span>
    <h1 class="title">Chess</h1>
    <p class="credit">Built by Mr. Putra</p>
    <p class="subtitle">Choose your game mode</p>
  </div>
  <div class="menu-btns">
    <button class="menu-btn" onclick="startHuman()">
      <span class="mb-title">2 Players</span>
      <span class="mb-desc">Local multiplayer on one device</span>
    </button>
    <button class="menu-btn" onclick="toggleDiff()">
      <span class="mb-title">vs Computer</span>
      <span class="mb-desc">Play against the AI</span>
    </button>
  </div>
  <div class="diff-panel" id="diffPanel" style="display:none">
    <p class="diff-label">Select Difficulty</p>
    <div class="diff-btns">
      <button class="diff-btn" onclick="startAI('beginner')">
        <span class="db-name">Beginner</span>
        <span class="db-desc">Random play</span>
      </button>
      <button class="diff-btn" onclick="startAI('intermediate')">
        <span class="db-name">Intermediate</span>
        <span class="db-desc">Smart captures</span>
      </button>
      <button class="diff-btn" onclick="startAI('hard')">
        <span class="db-name">Hard</span>
        <span class="db-desc">Tactical play</span>
      </button>
    </div>
  </div>
</div>

<div class="app" id="gameScreen" style="display:none">
  <header class="game-header">
    <div class="gh-top">
      <h1 class="title-sm">Chess</h1>
      <span class="badge" id="modeBadge">2 Players</span>
    </div>
    <p class="turn" id="turn"></p>
  </header>
  <div class="game-area">
    <div class="board-col">
      <div class="scene">
        <div class="board" id="board"></div>
        <div class="overlay" id="overlay">
          <div class="overlay-inner">
            <div class="overlay-txt" id="ovtxt"></div>
            <button class="btn" onclick="restartGame()">Play Again</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="sidebar">
      <div class="card">
        <div class="card-label">Last Move</div>
        <div id="lastMove"><span class="lm-placeholder">No moves yet</span></div>
      </div>
      <div class="card">
        <div class="card-label">Captured Pieces</div>
        <div class="cap-section">
          <div class="cap-side">
            <span class="cap-dot white"></span>
            <div class="cap-row" id="capW"></div>
          </div>
          <div class="cap-side">
            <span class="cap-dot black"></span>
            <div class="cap-row" id="capB"></div>
          </div>
        </div>
        <div class="material" id="material"></div>
      </div>
      <div class="card card-history">
        <div class="card-label">Move History</div>
        <div class="history-scroll" id="history">
          <div class="history-empty">Moves will appear here</div>
        </div>
      </div>
      <div class="thinking" id="thinking" style="display:none">Computer thinking...</div>
      <div class="actions">
        <button class="btn" onclick="restartGame()">New Game</button>
        <button class="btn btn-sec" onclick="backToMenu()">Menu</button>
      </div>
    </aside>
  </div>
  <footer class="footer">Built by Mr. Putra</footer>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">Promote pawn to</div>
    <div class="promo-choices" id="promo"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════ */

const SYM={wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
           bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
const PNAME={K:'King',Q:'Queen',R:'Rook',B:'Bishop',N:'Knight',P:'Pawn'};
const FILES='abcdefgh';
const PVAL={P:100,N:320,B:330,R:500,Q:900,K:20000};
const DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]];
const ORTH=[[-1,0],[1,0],[0,-1],[0,1]];
const ALL8=[...DIAG,...ORTH];
const JUMPS=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

/* Piece-square tables (White perspective) */
function ps(s){const v=s.split(',').map(Number),r=[];for(let i=0;i<64;i+=8)r.push(v.slice(i,i+8));return r}
const PST={
  P:ps('0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0'),
  N:ps('-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50'),
  B:ps('-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,10,10,10,10,0,-10,-10,5,5,10,10,5,5,-10,-10,0,5,10,10,5,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20'),
  R:ps('0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0'),
  Q:ps('-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20'),
  K:ps('-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20')
};

/* ═══════════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════════ */

let G, mode='human', aiLevel='beginner', moveSeq=0;

function newState(){
  return{
    board:initBoard(),turn:'w',
    castle:{wK:true,wQ:true,bK:true,bQ:true},
    ep:null,sel:null,legal:[],last:null,
    cap:{w:[],b:[]},history:[],over:false,result:'',promo:null
  };
}

function initBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const bk=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){
    b[0][c]={type:bk[c],color:'b'};b[1][c]={type:'P',color:'b'};
    b[6][c]={type:'P',color:'w'};b[7][c]={type:bk[c],color:'w'};
  }
  return b;
}

/* ═══════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════ */

function ok(r,c){return r>=0&&r<8&&c>=0&&c<8}
function opp(c){return c==='w'?'b':'w'}
function clB(b){return b.map(row=>row.map(cell=>cell?{...cell}:null))}
function clS(g){
  return{board:clB(g.board),turn:g.turn,castle:{...g.castle},
    ep:g.ep?{...g.ep}:null,last:g.last?{...g.last}:null,
    cap:{w:[...g.cap.w],b:[...g.cap.b]},history:[],over:g.over,result:''};
}
function findK(b,c){
  for(let r=0;r<8;r++)for(let c2=0;c2<8;c2++)
    if(b[r][c2]&&b[r][c2].color===c&&b[r][c2].type==='K')return{r,c:c2};
  return null;
}

/* ═══════════════════════════════════════════════════════════
   ATTACK DETECTION
   ═══════════════════════════════════════════════════════════ */

function att(b,tr,tc,by){
  for(const[dr,dc]of JUMPS){const r=tr+dr,c=tc+dc;
    if(ok(r,c)&&b[r][c]&&b[r][c].color===by&&b[r][c].type==='N')return true;}
  const pd=by==='w'?1:-1;
  for(const dc of[-1,1]){const r=tr+pd,c=tc+dc;
    if(ok(r,c)&&b[r][c]&&b[r][c].color===by&&b[r][c].type==='P')return true;}
  for(const[dr,dc]of ALL8){const r=tr+dr,c=tc+dc;
    if(ok(r,c)&&b[r][c]&&b[r][c].color===by&&b[r][c].type==='K')return true;}
  for(const[dr,dc]of DIAG){let r=tr+dr,c=tc+dc;
    while(ok(r,c)){if(b[r][c]){if(b[r][c].color===by&&(b[r][c].type==='B'||b[r][c].type==='Q'))return true;break}r+=dr;c+=dc;}}
  for(const[dr,dc]of ORTH){let r=tr+dr,c=tc+dc;
    while(ok(r,c)){if(b[r][c]){if(b[r][c].color===by&&(b[r][c].type==='R'||b[r][c].type==='Q'))return true;break}r+=dr;c+=dc;}}
  return false;
}

/* ═══════════════════════════════════════════════════════════
   MOVE GENERATION
   ═══════════════════════════════════════════════════════════ */

function pseudo(g,r0,c0){
  const p=g.board[r0][c0];if(!p)return[];
  const m=[],me=p.color,en=opp(me);
  const add=(r1,c1,sp,pr)=>m.push({fr:r0,fc:c0,tr:r1,tc:c1,spec:sp||null,promo:pr||null});
  const slide=dirs=>{for(const[dr,dc]of dirs){let r=r0+dr,c=c0+dc;
    while(ok(r,c)){if(!g.board[r][c])add(r,c);else{if(g.board[r][c].color===en)add(r,c);break}r+=dr;c+=dc;}}};
  switch(p.type){
    case'P':{const dir=me==='w'?-1:1,home=me==='w'?6:1,pr=me==='w'?0:7,fr=r0+dir;
      if(ok(fr,c0)&&!g.board[fr][c0]){
        if(fr===pr){for(const q of['Q','R','B','N'])add(fr,c0,'prom',q)}else add(fr,c0);
        const fr2=r0+2*dir;if(r0===home&&!g.board[fr2][c0])add(fr2,c0,'dbl');
      }
      for(const dc of[-1,1]){const nr=r0+dir,nc=c0+dc;if(!ok(nr,nc))continue;
        const t=g.board[nr][nc];
        if(t&&t.color===en){if(nr===pr){for(const q of['Q','R','B','N'])add(nr,nc,'prom',q)}else add(nr,nc)}
        if(g.ep&&g.ep.r===nr&&g.ep.c===nc)add(nr,nc,'ep');
      }break;}
    case'N':for(const[dr,dc]of JUMPS){const r=r0+dr,c=c0+dc;
      if(ok(r,c)&&(!g.board[r][c]||g.board[r][c].color===en))add(r,c)}break;
    case'B':slide(DIAG);break;case'R':slide(ORTH);break;case'Q':slide(ALL8);break;
    case'K':{
      for(const[dr,dc]of ALL8){const r=r0+dr,c=c0+dc;
        if(ok(r,c)&&(!g.board[r][c]||g.board[r][c].color===en))add(r,c)}
      const h=me==='w'?7:0;
      if(r0===h&&c0===4){
        if((me==='w'?g.castle.wK:g.castle.bK)&&!g.board[h][5]&&!g.board[h][6]){
          const rk=g.board[h][7];if(rk&&rk.type==='R'&&rk.color===me)add(h,6,'cks');}
        if((me==='w'?g.castle.wQ:g.castle.bQ)&&!g.board[h][3]&&!g.board[h][2]&&!g.board[h][1]){
          const rk=g.board[h][0];if(rk&&rk.type==='R'&&rk.color===me)add(h,2,'cqs');}
      }break;}
  }
  return m;
}

function sim(b,m){
  const nb=clB(b),pc={...nb[m.fr][m.fc]};nb[m.fr][m.fc]=null;
  if(m.spec==='ep')nb[m.fr][m.tc]=null;
  if(m.spec==='cks'){nb[m.fr][5]=nb[m.fr][7];nb[m.fr][7]=null}
  if(m.spec==='cqs'){nb[m.fr][3]=nb[m.fr][0];nb[m.fr][0]=null}
  if(m.promo)pc.type=m.promo;nb[m.tr][m.tc]=pc;return nb;
}

function legal(g,r0,c0){
  const p=g.board[r0][c0];if(!p)return[];
  const en=opp(p.color);
  return pseudo(g,r0,c0).filter(m=>{
    if(m.spec==='cks'||m.spec==='cqs'){
      if(att(g.board,r0,c0,en))return false;
      if(att(g.board,r0,m.spec==='cks'?5:3,en))return false;
      if(att(g.board,m.tr,m.tc,en))return false;return true;
    }
    const nb=sim(g.board,m),k=findK(nb,p.color);
    return k&&!att(nb,k.r,k.c,en);
  });
}

function allLegal(g){
  const m=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)
    if(g.board[r][c]&&g.board[r][c].color===g.turn)m.push(...legal(g,r,c));
  return m;
}

/* ═══════════════════════════════════════════════════════════
   ALGEBRAIC NOTATION
   ═══════════════════════════════════════════════════════════ */

function notation(g,m){
  const piece=g.board[m.fr][m.fc],cap=!!g.board[m.tr][m.tc]||m.spec==='ep';
  const dest=FILES[m.tc]+(8-m.tr);
  if(m.spec==='cks')return'O-O';if(m.spec==='cqs')return'O-O-O';
  let n='';
  if(piece.type==='P'){
    n=cap?FILES[m.fc]+'x'+dest:dest;if(m.promo)n+='='+m.promo;
  }else{
    n=piece.type;
    const others=[];
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      if(r===m.fr&&c===m.fc)continue;
      const q=g.board[r][c];
      if(q&&q.color===piece.color&&q.type===piece.type){
        if(legal(g,r,c).some(qm=>qm.tr===m.tr&&qm.tc===m.tc))others.push({r,c});
      }
    }
    if(others.length>0){
      const sf=others.some(o=>o.c===m.fc),sr=others.some(o=>o.r===m.fr);
      if(!sf)n+=FILES[m.fc];else if(!sr)n+=(8-m.fr);else n+=FILES[m.fc]+(8-m.fr);
    }
    if(cap)n+='x';n+=dest;
  }
  const s=clS(g);applyRaw(s,m);
  const ch=chk(s.board,opp(piece.color)),hl=hasLegal(s,opp(piece.color));
  if(ch&&!hl)n+='#';else if(ch)n+='+';
  return n;
}

/* ═══════════════════════════════════════════════════════════
   MOVE EXECUTION
   ═══════════════════════════════════════════════════════════ */

function chk(b,c){const k=findK(b,c);return k?att(b,k.r,k.c,opp(c)):false}
function hasLegal(g,c){
  for(let r=0;r<8;r++)for(let c2=0;c2<8;c2++)
    if(g.board[r][c2]&&g.board[r][c2].color===c&&legal(g,r,c2).length>0)return true;
  return false;
}

function applyRaw(g,m){
  const pc=g.board[m.fr][m.fc],vic=g.board[m.tr][m.tc];
  if(vic)g.cap[pc.color].push(vic);
  if(pc.type==='K'){if(pc.color==='w'){g.castle.wK=false;g.castle.wQ=false}else{g.castle.bK=false;g.castle.bQ=false}}
  if(pc.type==='R'){
    if(m.fr===7&&m.fc===0)g.castle.wQ=false;if(m.fr===7&&m.fc===7)g.castle.wK=false;
    if(m.fr===0&&m.fc===0)g.castle.bQ=false;if(m.fr===0&&m.fc===7)g.castle.bK=false;
  }
  if(m.tr===7&&m.tc===0)g.castle.wQ=false;if(m.tr===7&&m.tc===7)g.castle.wK=false;
  if(m.tr===0&&m.tc===0)g.castle.bQ=false;if(m.tr===0&&m.tc===7)g.castle.bK=false;
  if(m.spec==='ep'){g.cap[pc.color].push(g.board[m.fr][m.tc]);g.board[m.fr][m.tc]=null}
  if(m.spec==='cks'){g.board[m.fr][5]=g.board[m.fr][7];g.board[m.fr][7]=null}
  if(m.spec==='cqs'){g.board[m.fr][3]=g.board[m.fr][0];g.board[m.fr][0]=null}
  g.board[m.tr][m.tc]=pc;g.board[m.fr][m.fc]=null;
  if(m.promo)g.board[m.tr][m.tc]={type:m.promo,color:pc.color};
  g.ep=m.spec==='dbl'?{r:(m.fr+m.tr)/2,c:m.fc}:null;
  g.last={fr:m.fr,fc:m.fc,tr:m.tr,tc:m.tc};
  g.turn=opp(g.turn);
}

function doMove(g,m){
  const color=g.turn,n=notation(g,m);
  const vic=g.board[m.tr][m.tc]||(m.spec==='ep'?g.board[m.fr][m.tc]:null);
  applyRaw(g,m);
  g.history.push({notation:n,color,move:{...m},victim:vic?{...vic}:null});
  const c=chk(g.board,g.turn);
  if(!hasLegal(g,g.turn)){
    g.over=true;
    g.result=c?(g.turn==='w'?'Black':'White')+' wins by checkmate':'Draw by stalemate';
  }
  return c;
}

/* ═══════════════════════════════════════════════════════════
   AI ENGINE — Fast, no deep recursion
   ═══════════════════════════════════════════════════════════ */

/** Evaluate from side-to-move perspective */
function evalBoard(board,color){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=board[r][c];if(!p)continue;
    const sign=p.color===color?1:-1;
    const pr=p.color==='w'?r:7-r;
    s+=sign*(PVAL[p.type]+PST[p.type][pr][c]);
  }
  return s;
}

/** Score a single move for ordering */
function moveScore(st,m){
  let s=0;
  const vic=st.board[m.tr][m.tc],at=st.board[m.fr][m.fc];
  if(vic)s+=PVAL[vic.type]*10-PVAL[at.type];
  if(m.spec==='ep')s+=1000;
  if(m.promo)s+=PVAL[m.promo];
  return s;
}

/**
 * Beginner: random move with slight preference for captures
 */
function aiBeginner(){
  const m=allLegal(G);if(!m.length)return null;
  /* Weight: captures get bonus, otherwise random */
  let best=m[0],bestS=-Infinity;
  for(const mv of m){
    const s=(G.board[mv.tr][mv.tc]?PVAL[G.board[mv.tr][mv.tc].type]:0)+(Math.random()*80);
    if(s>bestS){bestS=s;best=mv}
  }
  return best;
}

/**
 * Intermediate: pick the best immediate move (1-ply look-ahead).
 * Considers captures, piece activity, and basic position.
 */
function aiIntermediate(){
  const m=allLegal(G);if(!m.length)return null;
  let best=m[0],bestS=-Infinity;
  for(const mv of m){
    const s=clS(G);applyRaw(s,mv);
    /* Evaluate position after move (from opponent's perspective, negate) */
    const sc=-evalBoard(s.board,G.turn)+moveScore(G,mv)*0.5;
    if(sc>bestS){bestS=sc;best=mv}
  }
  return best;
}

/**
 * Hard: 2-ply search with alpha-beta.
 * Fast — only evaluates each legal reply once.
 */
function aiHard(){
  const m=allLegal(G);if(!m.length)return null;
  /* Sort moves so captures/promotions are tried first */
  const ordered=m.map(mv=>({mv,s:moveScore(G,mv)})).sort((a,b)=>b.s-a.s).map(o=>o.mv);
  let best=ordered[0],bestS=-Infinity;
  for(const mv of ordered){
    const s=clS(G);applyRaw(s,mv);
    /* Opponent's best reply */
    const replies=allLegal(s);
    let worst=evalBoard(s.board,G.turn);
    if(replies.length>0){
      let opBest=-Infinity;
      for(const rm of replies){
        const s2=clS(s);applyRaw(s2,rm);
        const sc=-evalBoard(s2.board,G.turn);
        if(sc>opBest)opBest=sc;
      }
      worst=-opBest;
    }
    /* Add bonus for immediate tactical gains */
    const bonus=moveScore(G,mv)*0.3;
    const total=worst+bonus;
    if(total>bestS){bestS=total;best=mv}
  }
  return best;
}

function getAIMove(){
  switch(aiLevel){
    case'beginner':return aiBeginner();
    case'intermediate':return aiIntermediate();
    case'hard':return aiHard();
    default:return aiBeginner();
  }
}

/** Schedule AI move — near-instant with short visual delay */
function scheduleAIMove(){
  if(G.over||mode!=='ai'||G.turn!=='b')return;
  const seq=++moveSeq;
  $('thinking').style.display='block';
  /* Use requestAnimationFrame for smoother UI update, then compute */
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      if(seq!==moveSeq)return;
      const m=getAIMove();
      if(m){doMove(G,m);G.sel=null;G.legal=[]}
      $('thinking').style.display='none';
      render();
    },80); /* tiny delay so "thinking" is visible but feels instant */
  });
}

/* ═══════════════════════════════════════════════════════════
   UI RENDERING
   ═══════════════════════════════════════════════════════════ */

const $=id=>document.getElementById(id);

function render(){drawBoard();drawInfo()}

function drawBoard(){
  const el=$('board');el.innerHTML='';
  const check=!G.over&&chk(G.board,G.turn);
  const kp=check?findK(G.board,G.turn):null;

  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const sq=document.createElement('div');
    sq.className='sq '+((r+c)%2===0?'light':'dark');
    if(G.last){if(G.last.fr===r&&G.last.fc===c)sq.classList.add('last-from');
      if(G.last.tr===r&&G.last.tc===c)sq.classList.add('last-to')}
    if(G.sel&&G.sel.r===r&&G.sel.c===c)sq.classList.add('selected');
    if(kp&&kp.r===r&&kp.c===c)sq.classList.add('check');
    const isT=G.legal.some(m=>m.tr===r&&m.tc===c);
    const pc=G.board[r][c];
    const aiT=mode==='ai'&&G.turn==='b';
    if(!G.over&&!G.promo&&!aiT&&((pc&&pc.color===G.turn)||isT))sq.classList.add('clickable');
    if(isT){const ind=document.createElement('div');ind.className='ind '+(pc?'cap':'dot');sq.appendChild(ind)}
    if(pc){const sp=document.createElement('span');sp.className='piece';sp.textContent=SYM[pc.color+pc.type];sq.appendChild(sp)}
    if(r===7){const f=document.createElement('span');f.className='coord file';f.textContent=FILES[c];sq.appendChild(f)}
    if(c===0){const rk=document.createElement('span');rk.className='coord rank';rk.textContent=8-r;sq.appendChild(rk)}
    sq.addEventListener('click',()=>handleClick(r,c));
    el.appendChild(sq);
  }
}

function drawInfo(){
  const aiT=mode==='ai'&&G.turn==='b';
  const check=chk(G.board,G.turn);
  if(G.over){$('turn').textContent='Game Over';$('turn').className='turn'}
  else if(aiT){$('turn').textContent='Computer thinking...';$('turn').className='turn'}
  else if(mode==='ai'){$('turn').textContent='Your move'+(check?' — Check!':'');$('turn').className='turn'+(check?' alert':'')}
  else{const nm=G.turn==='w'?'White':'Black';$('turn').textContent=nm+' to move'+(check?' — Check!':'');$('turn').className='turn'+(check?' alert':'')}
  drawCap();drawLastMove();drawHistory();
  if(G.over){$('ovtxt').textContent=G.result;$('overlay').classList.add('vis')}
  else $('overlay').classList.remove('vis');
}

function drawCap(){
  const ord={Q:0,R:1,B:2,N:3,P:4};
  for(const color of['w','b']){
    const el=$(color==='w'?'capW':'capB');el.innerHTML='';
    const sorted=[...G.cap[color]].sort((a,b)=>(ord[a.type]??5)-(ord[b.type]??5));
    if(!sorted.length){const s=document.createElement('span');s.className='cap-pc';s.style.opacity='.2';s.textContent='—';el.appendChild(s)}
    for(const p of sorted){const s=document.createElement('span');s.className='cap-pc';s.textContent=SYM[p.color+p.type];el.appendChild(s)}
  }
  const wV=G.cap.w.reduce((s,p)=>s+PVAL[p.type],0);
  const bV=G.cap.b.reduce((s,p)=>s+PVAL[p.type],0);
  const d=wV-bV,mat=$('material');
  if(d>0)mat.textContent='White +'+(d/100).toFixed(0);
  else if(d<0)mat.textContent='Black +'+(-d/100).toFixed(0);
  else mat.textContent='Material equal';
}

function drawLastMove(){
  const el=$('lastMove');
  if(!G.history.length){el.innerHTML='<span class="lm-placeholder">No moves yet</span>';return}
  const last=G.history[G.history.length-1],m=last.move;
  let pType='P';
  if(m.spec==='cks'||m.spec==='cqs')pType='K';
  else{const n=last.notation;if(n[0]==='O')pType='K';else if('KQRBN'.includes(n[0]))pType=n[0]}
  const pSym=SYM[last.color+pType],pName=PNAME[pType];
  const from=FILES[m.fc]+(8-m.fr),to=FILES[m.tc]+(8-m.tr);
  let capH='';if(last.victim)capH='<div class="lm-capture">Captured: '+SYM[last.victim.color+last.victim.type]+' '+PNAME[last.victim.type]+'</div>';
  let extra='';
  if(m.spec==='cks')extra='Kingside castle';
  else if(m.spec==='cqs')extra='Queenside castle';
  else if(m.spec==='ep')extra='En passant';
  else if(m.promo)extra='Promoted to '+PNAME[m.promo];
  el.innerHTML='<div class="lm-row"><span class="lm-piece">'+pSym+'</span><div class="lm-info">'+
    '<div class="lm-detail">'+pName+'  '+from+' → '+to+'</div>'+
    (extra?'<div class="lm-capture">'+extra+'</div>':'')+capH+
    '<span class="lm-notation">'+last.notation+'</span></div></div>';
}

function drawHistory(){
  const el=$('history');
  if(!G.history.length){el.innerHTML='<div class="history-empty">Moves will appear here</div>';return}
  el.innerHTML='';
  const total=G.history.length,pairs=Math.ceil(total/2);
  for(let i=0;i<pairs;i++){
    const row=document.createElement('div');row.className='history-row';
    const num=document.createElement('span');num.className='h-num';num.textContent=(i+1)+'.';row.appendChild(num);
    const wI=i*2,wE=document.createElement('span');wE.className='h-move';
    if(wI<total){wE.textContent=G.history[wI].notation;if(wI===total-1){wE.classList.add('active');wE.classList.add('latest')}}
    row.appendChild(wE);
    const bI=i*2+1,bE=document.createElement('span');bE.className='h-move';
    if(bI<total){bE.textContent=G.history[bI].notation;if(bI===total-1){bE.classList.add('active');bE.classList.add('latest')}}
    row.appendChild(bE);el.appendChild(row);
  }
  el.scrollTop=el.scrollHeight;
}

/* ═══════════════════════════════════════════════════════════
   USER INTERACTION
   ═══════════════════════════════════════════════════════════ */

function handleClick(r,c){
  if(G.over||G.promo)return;if(mode==='ai'&&G.turn==='b')return;
  const pc=G.board[r][c];
  if(G.sel){
    const tg=G.legal.filter(m=>m.tr===r&&m.tc===c);
    if(tg.length>0){
      if(tg[0].spec==='prom'){showPromo(tg);return}
      doMove(G,tg[0]);G.sel=null;G.legal=[];render();
      if(mode==='ai'&&!G.over)scheduleAIMove();return;
    }
    if(pc&&pc.color===G.turn){G.sel={r,c};G.legal=legal(G,r,c);render();return}
    G.sel=null;G.legal=[];render();return;
  }
  if(pc&&pc.color===G.turn){G.sel={r,c};G.legal=legal(G,r,c);render()}
}

function showPromo(moves){
  G.promo=moves;const color=G.board[moves[0].fr][moves[0].fc].color;
  const el=$('promo');el.innerHTML='';
  for(const type of['Q','R','B','N']){
    const btn=document.createElement('div');btn.className='promo-btn';btn.textContent=SYM[color+type];
    btn.addEventListener('click',()=>{
      const m=G.promo.find(m=>m.promo===type);if(m)doMove(G,m);
      G.promo=null;G.sel=null;G.legal=[];$('modal').classList.remove('open');
      render();if(mode==='ai'&&!G.over)scheduleAIMove();
    });el.appendChild(btn);
  }
  $('modal').classList.add('open');
}

$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')){G.promo=null;G.sel=null;G.legal=[];$('modal').classList.remove('open');render()}
});

/* ═══════════════════════════════════════════════════════════
   MODE MANAGEMENT

function showScreen(id){
  $('menuScreen').style.display=id==='menu'?'flex':'none';
  $('gameScreen').style.display=id==='game'?'flex':'none';
}
function startHuman(){mode='human';$('modeBadge').textContent='2 Players';initGame();showScreen('game');render()}
function toggleDiff(){const dp=$('diffPanel');dp.style.display=dp.style.display==='none'?'block':'none'}
function startAI(level){
  mode='ai';aiLevel=level;
  const lb={beginner:'Beginner',intermediate:'Intermediate',hard:'Hard'};
  $('modeBadge').textContent='vs AI · '+lb[level];
  initGame();showScreen('game');render();
}
function initGame(){G=newState();moveSeq++;$('modal').classList.remove('open');$('thinking').style.display='none'}
function restartGame(){initGame();render()}
function backToMenu(){moveSeq++;showScreen('menu');$('diffPanel').style.display='none'}
showScreen('menu');
</script>
</body>
